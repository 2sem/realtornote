# GitHub evicts caches not accessed for 7 days. Restoring them on a schedule
# refreshes last-access (on hit) or recreates them (on miss), so CI/CD runs
# always start with a warm SPM cache. Scheduled runs use the default branch,
# so the caches are visible to PR and deploy runs.
name: Cache Warmup

on:
  push:
    branches: [ "main" ]
    paths:
      - 'Tuist/Package.resolved'
      - '.mise.toml'
  schedule:
    # 00:00 UTC on day 1, 8, 15, 22, 29 of each month (gap never exceeds 7 days)
    - cron: '0 0 1,8,15,22,29 * *'
  workflow_dispatch:

jobs:
  warmup:
    name: Warm SPM cache (${{ matrix.prefix }})
    runs-on: xcode-27
    strategy:
      fail-fast: false
      matrix:
        # Must match the cache keys in build-test.yml and deploy-ios.yml
        prefix: [spm, spm-deploy]
    permissions:
      contents: read

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Install Mise
      uses: jdx/mise-action@v5

    - name: Cache SPM dependencies
      id: spm-cache
      uses: actions/cache@v6
      with:
        path: |
          Tuist/.build
          ~/.cache/swifterpm
          ~/.cache/tuist
        key: ${{ matrix.prefix }}-${{ runner.os }}-${{ hashFiles('Tuist/Package.resolved') }}

    - name: Install Dependencies
      if: steps.spm-cache.outputs.cache-hit != 'true'
      run: |
        tuist install

  # Populates Tuist's remote binary cache (used by build-test.yml only; the
  # deploy workflow builds from source with --cache-profile none).
  # Must use the same runner/Xcode, Debug configuration and simulator
  # destination as `tuist test`, otherwise cache hashes won't match.
  binary-cache:
    name: Warm Tuist binary cache
    runs-on: xcode-27
    permissions:
      contents: read
      # required for Tuist OIDC authentication
      id-token: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Install Mise
      uses: jdx/mise-action@v5

    - name: Cache SPM dependencies
      uses: actions/cache@v6
      with:
        path: |
          Tuist/.build
          ~/.cache/swifterpm
          ~/.cache/tuist
        key: spm-${{ runner.os }}-${{ hashFiles('Tuist/Package.resolved') }}

    - name: Log in Tuist
      run: |
        tuist auth login

    - name: Install Dependencies
      run: |
        tuist install

    - name: Warm binary cache (external dependencies, Debug, simulator)
      run: |
        tuist cache warm --cache-profile only-external --configuration Debug --destination simulator
