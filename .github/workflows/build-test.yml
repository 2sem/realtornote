# For most projects, this workflow file will not need changing; you simply need
# to commit it to your repository.
#
# You may wish to alter this file to override the set of languages analyzed,
# or to provide custom queries or build logic.
#
# ******** NOTE ********
# We have attempted to detect the languages in your repository. Please check
# the `language` matrix defined below to confirm you have the correct set of
# supported CodeQL languages.
#
name: "Build & Test"

on:
  push:
    branches: [ "main" ]
    paths:
      - '**/*.swift'
      - '.mise.toml'
  pull_request:
    branches: [ "main" ]
    paths:
      - '**/*.swift'
      - '.mise.toml'

jobs:
  build-test:
    name: Build & Test
    runs-on: xcode-27
    permissions:
      # required for all workflows
      security-events: write

      # required to fetch internal or private CodeQL packs
      packages: read

      # only required for workflows in private repositories
      actions: read
      contents: read

      # required for Tuist OIDC authentication
      id-token: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Install Mise
      uses: jdx/mise-action@v5

    - name: Cache SPM dependencies
      id: spm-cache
      uses: actions/cache@v6
      with:
        path: |
          Tuist/.build
          ~/.cache/swifterpm
        key: spm-${{ runner.os }}-${{ hashFiles('Tuist/Package.resolved') }}

    - name: Log in Tuist
      if: steps.spm-cache.outputs.cache-hit == 'true'
      run: |
        tuist auth login

    - name: Install Dependencies
      run: |
        tuist install

    - name: Setup Tuist Cache Service
      if: steps.spm-cache.outputs.cache-hit == 'true'
      run: |
        tuist setup cache

    # On a GitHub cache miss, skip Tuist's binary cache and build from sources.
    - name: Test App
      env:
        TUIST_TEST_BINARY_CACHE: ${{ steps.spm-cache.outputs.cache-hit == 'true' && 'true' || 'false' }}
      run: |
        tuist test
